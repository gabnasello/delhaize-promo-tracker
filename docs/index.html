<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#102a43">
<meta name="description" content="A simple tracker for your Delhaize favourites that are currently on offer.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="logo.png">
<title>Delhaize Tracker</title>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--fg:#102a43;--muted:#64748b;--card:#fff;--line:#e5eaf0;--red:#e1001a;--blue:#1684e5;--gold:#f5c95b;--shadow:0 3px 14px rgba(16,42,67,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0c1725;--fg:#edf4fb;--muted:#a8b7c8;--card:#142438;--line:#293b50;--shadow:0 3px 16px rgba(0,0,0,.18)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1120px;margin:0 auto;padding:24px 20px 40px}
header{display:flex;align-items:center;gap:14px;padding:4px 0 20px;border-bottom:1px solid var(--line)}
.logo{width:64px;height:64px;flex:0 0 64px;object-fit:contain}
.brand{min-width:0;flex:1}
h1{font-size:1.28rem;line-height:1.2;margin:0;font-weight:750;letter-spacing:-.025em}
.tagline{font-size:.86rem;color:var(--muted);margin-top:4px}
#install{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:9px 14px;font:600 .84rem system-ui;cursor:pointer;white-space:nowrap}
#install[hidden]{display:none}
.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 16px;color:var(--muted);font-size:.86rem}
#meta{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;text-decoration:none;color:inherit;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.card:hover{transform:translateY(-2px);border-color:#9bbfe0}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:9px}
.name{font-size:.9rem;font-weight:600;line-height:1.35;margin-top:10px}
.price,.note{font-size:.78rem;color:var(--muted);margin-top:5px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badge{display:inline-flex;color:#fff;background:var(--red);border-radius:6px;padding:3px 7px;font-size:.72rem;line-height:1.25;font-weight:650}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:54px 16px;border:1px dashed var(--line);border-radius:14px}
footer{padding-top:22px;color:var(--muted);font-size:.75rem;text-align:center}
@media(max-width:520px){main{padding:16px 13px 30px}header{gap:11px}.logo{width:60px;height:60px;flex-basis:60px}h1{font-size:1.12rem}.tagline{font-size:.78rem}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:9px;border-radius:12px}.summary{padding:14px 0 12px}}
</style>
</head>
<body>
<main>
<header>
<img class="logo" src="logo.png" alt="" width="54" height="54">
<div class="brand"><h1>Delhaize Tracker</h1><div class="tagline">Your favourites, only when they're on offer.</div></div>
<button id="install" type="button" hidden>Install</button>
</header>
<section class="summary" aria-live="polite"><span id="meta">Loading offers…</span><span id="status"></span></section>
<section class="grid" id="offers" aria-label="Favourites currently on offer"></section>
<footer>Personal favourites · Updated every Thursday</footer>
</main>
<script>
const grid=document.getElementById('offers');
const meta=document.getElementById('meta');
const status=document.getElementById('status');
function render(data){
  grid.replaceChildren();
  const items=Array.isArray(data.items)?data.items:[];
  if(!items.length){
    const empty=document.createElement('div');empty.className='empty';empty.textContent='No favourites are on offer right now.';grid.append(empty);
  }
  items.forEach(item=>{
    const card=document.createElement('a');card.className='card';card.href=item.url||'#';card.target='_blank';card.rel='noopener noreferrer';
    const img=document.createElement('img');img.src=item.image||'';img.loading='lazy';img.alt='';img.referrerPolicy='no-referrer';card.append(img);
    const name=document.createElement('div');name.className='name';name.textContent=item.name||'Favourite product';card.append(name);
    if(item.price){const price=document.createElement('div');price.className='price';price.textContent='€ '+item.price;card.append(price);}
    const badges=document.createElement('div');badges.className='badges';
    (Array.isArray(item.offers)?item.offers:[]).forEach(label=>{const badge=document.createElement('span');badge.className='badge';badge.textContent=label;badges.append(badge);});
    if(badges.childElementCount)card.append(badges);
    if(item.valid_until){const note=document.createElement('div');note.className='note';const parts=item.valid_until.split('-');note.textContent='Until '+(parts.length===3?parts[2]+'/'+parts[1]:item.valid_until)+(item.needs_card?' · SuperPlus card':'');card.append(note);}
    grid.append(card);
  });
  const checked=new Date(data.checked_at);
  const date=Number.isNaN(checked.getTime())?'':checked.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
  meta.textContent=(items.length?items.length+' favourites on offer':'No favourites on offer')+(date?' · Checked '+date:'');
}
fetch('promos.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('Could not load offers');return response.json();})
.then(render).catch(()=>{meta.textContent='Offers could not be loaded. Please try again later.';const empty=document.createElement('div');empty.className='empty';empty.textContent='The latest offer list is temporarily unavailable.';grid.replaceChildren(empty);});
let installPrompt=null;
const installButton=document.getElementById('install');
const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
if(isStandalone)installButton.hidden=true;
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  if(isStandalone)return;
  installPrompt=event;
  installButton.hidden=false;
});
installButton.addEventListener('click',async()=>{
  if(!installPrompt)return;
  const prompt=installPrompt;
  installPrompt=null;
  installButton.hidden=true;
  await prompt.prompt();
  const choice=await prompt.userChoice;
  if(choice.outcome!=='accepted'&&!isStandalone)installButton.hidden=false;
});
window.addEventListener('appinstalled',()=>{
  installPrompt=null;
  installButton.hidden=true;
});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));}
</script>
</body>
</html>
