name: Weekly promo check
on:
  schedule:
    - cron: "17 3 * * 4"   # every Thursday 03:17 UTC
  push:
    paths:
      - ".github/weekly-promos-test"
  workflow_dispatch: {}   # manual run: Actions tab > Weekly promo check > Run workflow
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: Load private favorites from secret
        env:
          FAVORITES_CSV: ${{ secrets.FAVORITES_CSV }}
        run: |
          if [ -z "$FAVORITES_CSV" ]; then
            echo "::error::Secret FAVORITES_CSV is not set (Settings > Secrets and variables > Actions)"; exit 1
          fi
          # secret is gzip+base64 (data/favorites_secret.txt); plain CSV is accepted too
          if ! printf '%s' "$FAVORITES_CSV" | base64 -d 2>/dev/null | gunzip > data/favorites.csv 2>/dev/null; then
            printf '%s\n' "$FAVORITES_CSV" > data/favorites.csv
          fi
      - name: Check favorite promotions
        run: python checker/check_promos.py
      - name: Commit results (keeps the schedule alive)
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add docs/promos.json
          if ! git diff --staged --quiet; then
            # Rebase the generated result onto the latest main so a code push
            # during a long scrape cannot make this bot commit fail.
            cp docs/promos.json /tmp/promos.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/promos.json docs/promos.json
            git add docs/promos.json
            if ! git diff --staged --quiet; then
              git commit -m "Update offers"
              git push origin HEAD:main
            fi
          fi
      - name: Prepare square logo and app icons
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          source = Image.open("Radar Lion Emblem.png").convert("RGBA")
          source.save("docs/logo.png", optimize=True)
          source.resize((192, 192), Image.Resampling.LANCZOS).save("docs/icon-192.png", optimize=True)
          source.resize((512, 512), Image.Resampling.LANCZOS).save("docs/icon-512.png", optimize=True)
          source.resize((32, 32), Image.Resampling.LANCZOS).save("docs/favicon-32.png", optimize=True)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: check-and-deploy
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait for the Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | head -n 1)
            if [ -n "$artifact_id" ]; then
              echo "Pages artifact is available (ID: $artifact_id)."
              exit 0
            fi
            echo "Pages artifact not visible yet (attempt $attempt/12); waiting 5 seconds."
            sleep 5
          done
          echo "::error::Pages artifact was not available after 60 seconds."
          exit 1
      - id: deploy
        uses: actions/deploy-pages@v4
