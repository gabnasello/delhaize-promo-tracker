name: Weekly promo check
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/promos.json" # avoid a second run when the scheduled job commits its results
  schedule:
    - cron: "0 5 * * 4"   # every Thursday 05:00 UTC = 06:00/07:00 Belgian time
  workflow_dispatch: {}   # manual run: Actions tab > Weekly promo check > Run workflow
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: Load private favorites from secret
        env:
          FAVORITES_CSV: ${{ secrets.FAVORITES_CSV }}
        run: |
          if [ -z "$FAVORITES_CSV" ]; then
            echo "::error::Secret FAVORITES_CSV is not set (Settings > Secrets and variables > Actions)"; exit 1
          fi
          # secret is gzip+base64 (data/favorites_secret.txt); plain CSV is accepted too
          if ! printf '%s' "$FAVORITES_CSV" | base64 -d 2>/dev/null | gunzip > data/favorites.csv 2>/dev/null; then
            printf '%s\n' "$FAVORITES_CSV" > data/favorites.csv
          fi
      - name: Check favorite promotions
        run: python checker/check_promos.py
      - name: Commit results (keeps the schedule alive)
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add docs/promos.json
          git diff --staged --quiet || (git commit -m "Update offers" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
