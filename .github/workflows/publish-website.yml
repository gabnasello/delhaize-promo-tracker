name: Publish website only

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Radar Lion Emblem.png"
      - "!docs/promos.json"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website files
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Add original logo and app icons to website
        run: |
          cp "Radar Lion Emblem.png" docs/logo.png
          cp "Radar Lion Emblem.png" docs/icon-192.png
          cp "Radar Lion Emblem.png" docs/icon-512.png
      - name: Upload existing website and promotion data
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
