name: Publish website only

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Radar Lion Emblem.png"
      - "!docs/promos.json"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website files
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare square logo and app icons
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          source = Image.open("Radar Lion Emblem.png").convert("RGBA")
          source.save("docs/logo.png", optimize=True)
          source.resize((192, 192), Image.Resampling.LANCZOS).save("docs/icon-192.png", optimize=True)
          source.resize((512, 512), Image.Resampling.LANCZOS).save("docs/icon-512.png", optimize=True)
          source.resize((32, 32), Image.Resampling.LANCZOS).save("docs/favicon-32.png", optimize=True)
          PY
      - name: Upload existing website and promotion data
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
